# VLA Scheduling-Block (SB) scoring rubric
# =========================================
# Scoring convention: every rule is worth 1 point -- 1/1 when it is met, 0/1 when it
# is not. There is no negative score. A rule that cannot be decided automatically
# raises a HUMAN REVIEW FLAG: it takes the else branch (0) provisionally and a human
# then rules it 1 or 0, so every rule ends up either 1/1 or 0/1 in the final score.
# Each check has a `tier`, describing HOW it is resolved:
#   mechanical -> read straight off the SB file (syntax, structure, allowed names)
#   computed   -> a deterministic comparison against a reference value: the prompt
#                 the SB was generated from, or an NRAO guidance table
#   expert     -> needs astronomical judgement (the VLA calibrator database, true
#                 source positions); answered from the ground-truth SB or the LLM
#                 judge, and raised as a HUMAN REVIEW FLAG when neither can decide
#
# Whether a check is advisory is independent of its tier and is set by points:
# `points: 0` with `fail_points: 0` makes a check informational -- reported for a
# human, excluded from the score and from the pass/fail tallies.
# The reference tables (hardware allowlist, config schedule, cycle times, ...) live in
# score_sb.py under the "REFERENCE DATA" section and are easy to edit there.

meta:
  name: VLA SB scoring rubric
  scoring: "1/1 per satisfied rule, 0/1 per violation; a rule that cannot be decided
    automatically raises a HUMAN REVIEW FLAG, scores 0 provisionally, and is ruled
    1 or 0 by a human before the score is final"
  # Applies to every rule unless it sets its own fail_points: an unmet rule scores 0,
  # never -1.
  fail_default: 0
  sources: "RADAR ChatGPT SB creation investigation.docx; Manual Scoring example_ Notes.docx"

checks:
  - id: version_present
    title: "VERSION; 7; present as first non-blank line"
    tier: mechanical
    points: 1
    source: "Notes comment 0; RADAR sec7"

  - id: src_cat_present
    title: "SRC-CAT line present"
    tier: mechanical
    points: 1
    source: "Notes comment 1; RADAR sec7"

  - id: hdwr_cat_present
    title: "HDWR-CAT line present"
    tier: mechanical
    points: 1
    source: "Notes comment 2"

  - id: loop_closure
    title: "Every LOOP-START has a matching LOOP-END"
    tier: mechanical
    points: 1
    source: "Notes comment 8; RADAR sec7"

  - id: dummy_setup_first
    title: "First scan is a dummy/setup scan (SetAtnGain intent)"
    tier: mechanical
    points: 1
    source: "RADAR sec7 template"

  - id: hardware_in_allowlist
    title: "Every hardware resource is a valid catalog name"
    tier: mechanical
    points: 1
    source: "Notes comment 5,7; RADAR sec2 (the Ku48f2 vs Ku48f2A bug)"

  - id: intents_valid
    title: "Every scan intent is from the allowed set"
    tier: mechanical
    points: 1
    source: "Notes comment 6"

  - id: flux_present
    title: "A flux-density calibrator scan (CalFlux) is present"
    tier: mechanical
    points: 1
    source: "RADAR sec6, sec7 template"

  - id: bandpass_present
    title: "A bandpass calibrator scan (CalBP) is present"
    tier: mechanical
    points: 1
    source: "RADAR sec6, sec7 template"

  - id: flux_cal_standard
    title: "Flux calibrator is a standard source (3C286/3C48/3C147)"
    tier: mechanical
    points: 1
    source: "Notes comment 4; RADAR sec6"

  - id: phase_present
    title: "A phase/gain calibrator scan (CalGain) is present"
    tier: mechanical
    points: 1
    source: "RADAR sec5, sec7 template"

  - id: target_present
    title: "A target scan (ObsTgt) is present"
    tier: mechanical
    points: 1
    source: "RADAR sec1, sec7 template"

  - id: one_phase_per_target_loop
    title: "Each target loop contains exactly one phase-cal line"
    tier: mechanical
    points: 1
    source: "Notes comment 10"

  - id: template_order
    title: "Scan order is setup -> flux/bandpass -> phase -> target"
    tier: mechanical
    points: 1
    source: "RADAR sec7 template truths"

  - id: config_matches_date
    title: "Array configuration matches the observing-date window"
    tier: mechanical
    points: 1
    source: "RADAR sec4 config schedule"

  - id: highfreq_refpointing
    title: "High-freq SB (Ku/K/Ka/Q) has X-band reference pointing (or a waiver)"
    tier: mechanical
    points: 1
    source: "RADAR sec1 high-frequency table"

  - id: cycle_time
    title: "Phase-target cycle time within NRAO guidance for band/config"
    tier: computed
    points: 1
    source: "RADAR sec8 cycle-time table"

  - id: phase_cal_visible
    title: "Phase calibrator observable in chosen band and array config"
    tier: expert
    points: 1
    source: "Notes comment 9; RADAR sec5"

  - id: phase_cal_separation
    title: "Phase-cal angular separation within band-dependent threshold"
    tier: expert
    points: 1
    source: "RADAR sec5 separation table"

  - id: target_matches_prompt
    title: "Target name resolves in the source catalog at the prompted position"
    tier: computed
    points: 1
    source: >-
      O'Dwyer 2026: the SB references its target by NAME only, and the position
      the OPT uses comes from the source catalog (SCT) now generated alongside
      the SB. Resolving the name in that catalog and comparing the catalogued
      position with the prompt makes this a real pointing check. The RA/Dec in
      the SCHED-BLOCK comment is decorative and is reported, never scored.

  - id: total_time_matches_request
    title: "Total SB duration matches the requested observing time"
    tier: computed
    points: 1
    source: >-
      Corsi review (RADAR II sec4.2): the requested total is the quantity with a
      well-defined correct value; the split between overheads and on-source time
      is observing strategy and is reported, not scored.
